name: Build and release pack

# Tag a version to cut a release:  git tag v1.5.1 && git push --tags
# Players on the packwiz-installer auto-update path do not need this at all --
# they pick up main on next launch. This is for first installs and for anyone
# using the Modrinth App / ATLauncher / CurseForge.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pack
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: Validate pack index
        # refresh rewrites index.toml; if it differs, someone committed a stale
        # index and players would get hash-invalid errors on install.
        run: |
          packwiz refresh
          if ! git diff --exit-code index.toml pack.toml; then
            echo "::error::index.toml is stale. Run 'packwiz refresh' and commit the result."
            exit 1
          fi

      - name: Verify pack integrity
        # Catches mods silently re-sourced to CurseForge, per-player files
        # leaking into the pack, and missing side labels. See scripts/verify_pack.py
        run: python3 scripts/verify_pack.py

      - name: Export Modrinth pack
        # GITHUB_REF_NAME is "1/merge" on pull_request events, and the slash makes
        # packwiz try to write into a directory that does not exist. Tag and
        # branch runs never hit this, so it sat unnoticed until the first PR.
        run: |
          ref="${GITHUB_REF_NAME:-dev}"
          packwiz modrinth export -o "terra-aeterna-${ref//\//-}.mrpack"

      - name: Verify export contains no unexpected overrides
        run: |
          python3 - <<'PY'
          import glob, posixpath, sys, zipfile
          pack = glob.glob("*.mrpack")[0]
          # Directories the pack may legitimately write into a player's instance.
          allowed = ("overrides/mods/", "overrides/config/", "overrides/resourcepacks/",
                     "overrides/shaderpacks/", "overrides/kubejs/")
          # Vanilla per-player files. Only banned at the INSTANCE ROOT -- several
          # mods ship their own config named options.txt (fancymenu,
          # drippyloadingscreen) and those are legitimate pack config.
          banned_at_root = {
              "options.txt", "optionsof.txt", "optionsshaders.txt", "servers.dat",
              "usercache.json", "usernamecache.json", ".sync-instance-path",
          }
          # Per-player or machine-identifying files, banned wherever they appear.
          banned_anywhere = {
              "sodium-fingerprint.json", "xaeropatreon.txt",
              "player-volumes.properties", "username-cache.json",
          }
          bad, leaked = [], []
          with zipfile.ZipFile(pack) as z:
              for n in z.namelist():
                  if not n.startswith("overrides/") or n.endswith("/"):
                      continue
                  if not n.startswith(allowed):
                      bad.append(n)
                  rel = n[len("overrides/"):]
                  base = posixpath.basename(n)
                  if (rel in banned_at_root) or (base in banned_anywhere):
                      leaked.append(n)
          if bad:
              print("::error::unexpected paths in mrpack overrides: " + ", ".join(sorted(bad)[:20]))
          if leaked:
              print("::error::per-player files would ship to everyone: " + ", ".join(sorted(leaked)))
          if bad or leaked:
              sys.exit(1)
          print(f"{pack}: overrides clean")
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mrpack
          path: "*.mrpack"

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.mrpack"
          generate_release_notes: true
