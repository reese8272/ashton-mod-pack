[gameplay]
	#If true, mobs that lose their head die after the original 40-99 tick delay (about 2-5 seconds).
	headlessDeath = true
	#Use the original tool-based detach chances for melee and the original 33% fallback for projectiles.
	toolEffect = true
	#Fallback detachment chance when toolEffect is disabled or no projectile override is present.
	# Default: 100
	# Range: 0 ~ 100
	gibChance = 100
	#Allow arrows and other projectiles to detach limbs.
	allowProjectileGibbing = true
	#Allow other players to be visually dismembered as well.
	playerGibs = true
	#Enable arm amputation.
	enableArmAmputation = true
	#Enable head amputation.
	enableHeadAmputation = true
	#Enable leg amputation.
	enableLegAmputation = true
	#Enable head-only decapitation for supported vanilla animals.
	enableAnimalDecapitation = false
	#Delayed death after decapitation in seconds. Set to 0 to disable. Animals use half this value.
	# Default: 5.0
	# Range: 0.0 ~ 30.0
	headlessDeathDelaySeconds = 5.0
	#Optional per-projectile chances, for example minecraft:arrow=33 or net.minecraft.world.entity.projectile.ThrownTrident=100.
	projectileList = []
